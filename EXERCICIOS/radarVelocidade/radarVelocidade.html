<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de velocidade</title>

    <link rel="stylesheet" href="estilo_exs_radar.css">
</head>

<body>
    <header>
        <h1>Radar de velocidade</h1>
    </header>

    <section>
        <div>
            Velocidade permitida na via: <input type="number" id="velocRadar"> 
        </div>
        <div>
            Velocidade que estava transitando: <input type="number" id="velocVeiculo">
        </div>
        <div class="small">
            <small><span style="color: red; font-weight: bold;">ATENÇÃO:</span> Está sendo levado em conta a tolerância de 7Km/h para velocidades abaixo de 100Km/h e de 7% para velocidades acima de 100Km/h</small>
        </div>
        <div>
            <input type="button" value="Calcular" id="calcular">
        </div>
        <div id="res"></div>
    </section>

    <footer>
        <p>&copy; Bisaio</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
