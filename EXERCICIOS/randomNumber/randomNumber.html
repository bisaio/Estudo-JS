<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número aleatório</title>

    <link rel="stylesheet" href="../estilo_exs.css">
</head>

<body>
    <header>
        <h1>Número aleatório</h1>
    </header>

    <section>
        <div>
            <p>Será gerado um número aleatório entre 1 e 5. Tente acertar qual número foi gerado.</p>
                <input type="radio" name="radNum" id="1" checked>
                    <label>1</label>
                <input type="radio" name="radNum" id="2">
                    <label>2</label>
                <input type="radio" name="radNum" id="3">
                    <label>3</label>
                <input type="radio" name="radNum" id="4">
                    <label>4</label>
                <input type="radio" name="radNum" id="5">
                    <label>5</label>
                <p><input type="button" value="Confirmar" id="confirmar"></p>
        </div>
        <div id="res"></div>
    </section>

    <footer>
        <p>&copy; Bisaio</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
