<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da forca</title>

    <link rel="stylesheet" href="../estilo_exs.css">
</head>

<body>
    <header>
        <h1>Jogo da forca</h1>
    </header>

    <section>
        <div id="div_word">
            <p>Que palavra será jogada na forca?</p>
            <input type="text" id="palavra">
            <p><input type="button" value="Confirmar" id="confirm_word"></p>
        </div>

        <div id="div_letter" style="display: none;">
            <p>Escolha uma letra.</p>
            <input type="text" id="letra">
            <p><input type="button" value="Confirmar" id="confirm_letter"></p>
        </div>
        <div id="res"></div>
    </section>

    <footer>
        <p>&copy; Bisaio</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
